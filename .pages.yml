- name: tablets
    label: Tablets Database
    type: collection
    path: src/content/tablets
    extension: md
    fields:
      - name: title
        label: Tablet Full Name
        type: string
      - name: brand
        label: Brand Name
        type: string
      - name: release_date
        label: Release Announcement Date
        type: string
      - name: processor
        label: Processor / Chipset (CPU)
        type: string
      - name: ram
        label: Memory (RAM options)
        type: string
      - name: storage
        label: Storage Options
        type: string
      - name: screen_size
        label: Display / Screen Size
        type: string
      - name: battery
        label: Battery Capacity
        type: string
      - name: draft
        label: Is this a Draft?
        type: boolean
        default: true
      - name: body
        label: Full Specifications Overview Table / Summary Text
        type: rich-text
